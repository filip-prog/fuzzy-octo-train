<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOW DNS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080b11;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px 100px 16px;
        }

        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .logo-snow {
            color: #ffffff;
        }

        .logo-dns {
            color: #1a73e8;
        }

        .yt-button {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            color: #9ca3af;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 35px;
            text-align: center;
        }

        .hero-icon {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(26, 115, 232, 0.4));
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .hero-title span {
            color: #1a73e8;
        }

        .hero-subtitle {
            color: #1a73e8;
            font-size: 1rem;
            font-weight: 700;
        }

        .section-header {
            width: 100%;
            max-width: 420px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #4b5563;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .cards-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #0d131e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 0.8rem;
            color: #4b5563;
        }

        .download-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .download-btn:active {
            background: rgba(26, 115, 232, 0.2);
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            width: calc(100% - 32px);
            max-width: 400px;
            background: rgba(13, 19, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #4b5563;
            font-size: 0.65rem;
            font-weight: 800;
            text-decoration: none;
        }

        .nav-item.active {
            color: #1a73e8;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span class="logo-snow">SNOW</span>
            <span class="logo-dns">DNS</span>
        </div>
        <a href="#" class="yt-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="4"/><path d="m10 9 5 3-5 3z"/></svg>
            YOUTUBE
        </a>
    </div>

    <div class="hero">
        <svg class="hero-icon" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="1.5"><path d="M12 2v20M2 12h20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg>
        <h1 class="hero-title">SNOW<span>DNS</span></h1>
        <div class="hero-subtitle">Your DNS. Your way.</div>
    </div>

    <div class="section-header">ESIGN (5 CERTIFICATE)</div>

    <div class="cards-container">
        <div class="card">
            <div>
                <div class="card-title">ESign Pack #1</div>
                <div class="card-subtitle">Cert: Enterprise Cert 001</div>
            </div>
            <a href="profile.mobileconfig" download="profile.mobileconfig" class="download-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </a>
        </div>

        <div class="card">
            <div>
                <div class="card-title">ESign Pack #2</div>
                <div class="card-subtitle">Cert: Enterprise Cert 002</div>
            </div>
            <a href="profile.mobileconfig" download="profile.mobileconfig" class="download-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            ESIGN
        </a>
        <a href="#" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 2-2 2m-1-1 2 2M11 13.5a5.5 5.5 0 1 1 7.78-7.78l-9.39 9.39a3 3 0 0 1-2.12.88H4v-3.29a3 3 0 0 1 .88-2.12l9.39-9.39z"/></svg>
            KSIGN
        </a>
        <a href="#" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/></svg>
            SCARLET
        </a>
        <a href="#" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L3 13.05V21h7.95l9.29-8.76z"/></svg>
            FEATHER
        </a>
        <a href="#" class="nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            OTHERS
        </a>
    </div>

</body>
</html>
