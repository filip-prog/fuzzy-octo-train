<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOW DNS</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-blue: #2563eb;
            --text-main: #ffffff;
            --text-muted: #6b7280;
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .logo span { color: var(--accent-blue); }

        .yt-btn {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .snowflake-img {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px rgba(37, 99, 235, 0.4));
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
        }

        .hero h1 span { color: var(--accent-blue); }

        .hero p {
            color: var(--accent-blue);
            font-size: 1.05rem;
            font-weight: 700;
            margin-top: 6px;
        }

        .section-title {
            width: 100%;
            max-width: 440px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .card-list {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            margin: 0 0 4px 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .card-info p {
            margin: 0;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .nav-bar {
            position: fixed;
            bottom: 20px;
            width: calc(100% - 40px);
            max-width: 400px;
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            text-decoration: none;
            gap: 4px;
        }

        .nav-item.active { color: var(--accent-blue); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            SNOW <span>DNS</span>
        </div>
        <a href="#" class="yt-btn">📺 YOUTUBE</a>
    </header>

    <div class="hero">
        <svg class="snowflake-img" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5"><path d="M12 2v20M2 12h20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg>
        <h1>SNOW<span>DNS</span></h1>
        <p>Your DNS. Your way.</p>
    </div>

    <div class="section-title">ESIGN (5 CERTIFICATE)</div>

    <div class="card-list">
        <div class="card">
            <div class="card-info">
                <h3>ESign Pack #1</h3>
                <p>Cert: Enterprise Cert 001</p>
            </div>
            <a href="profile.mobileconfig" type="application/x-apple-aspen-config" download="profile.mobileconfig" class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </a>
        </div>

        <div class="card">
            <div class="card-info">
                <h3>ESign Pack #2</h3>
                <p>Cert: Enterprise Cert 002</p>
            </div>
            <a href="profile.mobileconfig" type="application/x-apple-aspen-config" download="profile.mobileconfig" class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </a>
        </div>
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item active">🖋️<span>ESIGN</span></a>
        <a href="#" class="nav-item">🔑<span>KSIGN</span></a>
        <a href="#" class="nav-item">🔥<span>SCARLET</span></a>
        <a href="#" class="nav-item">🪶<span>FEATHER</span></a>
        <a href="#" class="nav-item">🎛️<span>OTHERS</span></a>
    </div>

</body>
</html>
