<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOW DNS</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-blue: #3b82f6;
            --text-color: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-icon {
            font-size: 4rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 1px;
        }

        .hero h1 span {
            color: var(--accent-blue);
        }

        .hero p {
            color: var(--accent-blue);
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .section-title {
            width: 100%;
            max-width: 500px;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .card-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
        }

        .card-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .download-btn {
            background-color: #1f2937;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .download-btn:active {
            background-color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">❄️ SNOW <span>DNS</span></div>
    </header>

    <div class="hero">
        <div class="hero-icon">❄️</div>
        <h1>SNOW<span>DNS</span></h1>
        <p>Your DNS. Your way.</p>
    </div>

    <div class="section-title">ESIGN (5 CERTIFICATE)</div>

    <div class="card-list">
        <div class="card">
            <div class="card-info">
                <h3>ESign Pack #1</h3>
                <p>Cert: Enterprise Cert 001</p>
            </div>
            <a href="profile.mobileconfig" download="profile.mobileconfig" class="download-btn">📥</a>
        </div>

        <div class="card">
            <div class="card-info">
                <h3>ESign Pack #2</h3>
                <p>Cert: Enterprise Cert 002</p>
            </div>
            <a href="profile.mobileconfig" download="profile.mobileconfig" class="download-btn">📥</a>
        </div>
    </div>

</body>
</html>
